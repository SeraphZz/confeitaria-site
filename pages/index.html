<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/tema.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <div id="cabecalho"></div>
  <main>
    <section class="capa">
      <div class="container">
        <h1 id="capa-titulo"></h1>
        <p id="capa-slogan"></p>
        <a class="btn btn-solid theme-primary btn-lg" href="#produtos" id="ver-produtos">Ver produtos</a>
      </div>
    </section>
    <section class="secao" id="produtos">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-5">
          <h2 class="secao-titulo mb-0" id="titulo-produtos">Produtos</h2>
          <a class="btn btn-outline theme-primary" id="novo-produto" href="/admin#produtos" hidden>+ Adicionar produto</a>
        </div>
        <div class="grade-produtos" id="grade"></div>
      </div>
    </section>
  </main>
  <div id="rodape"></div>
  <script type="module" src="/js/bootstrap.bundle.min.js"></script>
  <script defer src="/js/app.js"></script>
  <script defer src="/js/home.js"></script>
</body>
</html>
